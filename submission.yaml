submission:
  title: "Grid Guardian: Power Outage Prediction & Equipment Failure Advisor"

  problem_statement: >
    Power transformer and substation failures can cause major power outages,
    affecting large numbers of customers and creating significant operational
    and financial losses for utilities. Traditional maintenance approaches
    may not combine equipment health, weather conditions, and historical
    incidents in time to identify which assets require attention first.

  solution_summary: >
    Grid Guardian combines simulated equipment sensor telemetry, live weather
    data from Open-Meteo, and historical incident records to calculate an
    explainable composite risk score for each grid asset. It ranks assets by
    risk and grid impact, then generates prioritized maintenance and crew
    pre-positioning plans. The same risk, maintenance, and crew-planning
    capabilities are exposed through an MCP server for IBM Bob integration.

  key_features:
    - "Composite risk scoring that combines sensor health, live weather, and historical incident data for each asset"
    - "Grid-impact-severity ranking using predicted risk, customers served, and asset criticality"
    - "Explainable maintenance planning with prioritized actions and recommended response windows"
    - "Crew pre-positioning that assigns suitable crews to high-risk assets and regions"
    - "IBM Bob MCP integration exposing the risk engine, maintenance planner, crew planner, and asset information as callable tools"

  tech_stack:
    languages:
      - "Python"
      - "JavaScript"
      - "HTML"
      - "CSS"

    frameworks:
      - "FastAPI"
      - "Pydantic"

    ibm_technologies:
      - "IBM Bob"
      - "Model Context Protocol (MCP)"

    databases: []

    other:
      - "Open-Meteo API"
      - "Uvicorn"
      - "Pytest"
      - "GitHub Actions"

  what_we_are_most_proud_of: >
    We are most proud of turning equipment-risk prediction into an actionable
    decision workflow rather than stopping at a risk score. Grid Guardian
    identifies which assets are at risk, evaluates the potential grid impact,
    recommends maintenance actions, and helps pre-position crews. The same
    backend intelligence is also exposed to IBM Bob through MCP for live
    interaction with the risk engine.

  known_limitations: >
    This is a prototype and does not connect to a real utility SCADA or IoT
    infrastructure. Asset information, sensor telemetry, and historical
    incident records are simulated for demonstration purposes, while weather
    data is retrieved live from Open-Meteo. The risk engine uses an
    explainable weighted scoring approach rather than a production-trained
    machine-learning model.

